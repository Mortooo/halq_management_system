{% load query_compat %}
{% if is_paginated %}
<nav class="mt-8 flex items-center justify-center gap-2" aria-label="التنقل بين الصفحات">
    {% if page_obj.has_previous %}
    <a href="{% querystring page=page_obj.previous_page_number %}"
       class="btn btn-secondary px-4 py-2">
        السابق
    </a>
    {% endif %}
    <span class="btn btn-primary px-4 py-2" dir="ltr">
        {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
    </span>
    {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}"
       class="btn btn-secondary px-4 py-2">
        التالي
    </a>
    {% endif %}
</nav>
{% endif %}
