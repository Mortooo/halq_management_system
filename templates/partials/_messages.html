{% if messages %}
<div id="messages-container" class="fixed top-20 start-5 z-[80] space-y-2 w-[calc(100%-2.5rem)] sm:w-96">
    {% for message in messages %}
    <div
        x-data="{ show: true }"
        x-init="setTimeout(() => show = false, 4000)"
        x-show="show"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 -translate-y-5"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-500"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-5"
        @click="show = false"
        role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}"
        class="cursor-pointer px-4 py-3 rounded-xl flex items-center justify-between
                {% if message.tags == 'success' %} bg-green-100 text-green-800 border border-green-200
                {% elif message.tags == 'error' %} bg-red-100 text-red-800 border border-red-200
                {% elif message.tags == 'warning' %} bg-yellow-50 text-yellow-800 border border-yellow-200
                {% else %} bg-blue-50 text-blue-800 border border-blue-200 {% endif %}">
        <span class="font-medium">{{ message }}</span>
        <button type="button" aria-label="إغلاق التنبيه" class="shrink-0 ms-3 opacity-80 hover:opacity-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
